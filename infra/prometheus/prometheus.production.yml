global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/hosted-facilitator-alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: hosted-metrics-exporter
    scrape_timeout: 10s
    static_configs:
      - targets: ["hosted-metrics-exporter:9108"]
